name: StayUp
options:
  bundleIdPrefix: com.meric
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

# The team lives outside the repository; see Signing.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Both read by Sources/Info.plist, which xcodegen writes from this file.
    # Bump MARKETING_VERSION for people and CURRENT_PROJECT_VERSION for tools.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM comes from Signing.local.xcconfig.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    # The sandbox stays off, and it is not an oversight. The app runs `sudo`
    # and `osascript`, and reads other tools' transcripts under the home
    # directory; a sandboxed process can do none of those things.
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  StayUp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [Resources]
      # The script and the plist ride along as files, not as compiled input:
      # the install runs a copy of them from a temp directory as root.
      - path: Sources/Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: StayUp
        CFBundleDisplayName: StayUp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        # What keeps it off the Dock and out of the app switcher.
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Meric Kucukmeric"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meric.stayup
        GENERATE_INFOPLIST_FILE: "NO"

  StayUpTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: StayUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meric.stayup.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  StayUp:
    build:
      targets:
        StayUp: all
        StayUpTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StayUpTests
